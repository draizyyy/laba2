<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence Lab UI</title>
<style>
body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
.panel { background: #252526; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #333; }
label { display: block; margin-bottom: 4px; font-size: 12px; color: #888; }
input, select { background: #333; color: #fff; border: 1px solid #555; padding: 6px; width: 100%; margin-bottom: 10px; }
button { background: #0e639c; color: white; border: none; padding: 8px 12px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; }
button:hover { background: #1177bb; }
button.secondary { background: #444; }
#output { background: #111; padding: 10px; min-height: 100px; white-space: pre-wrap; overflow-x: auto; border: 1px solid #444; font-size: 13px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="row">
      <div>
        <label>Sequence Type</label>
        <select id="seqType">
          <option value="Array">ArraySequence</option>
          <option value="List">ListSequence</option>
          <option value="Bit">BitSequence</option>
        </select>
      </div>
      <div>
        <label>Data Type</label>
        <select id="dataType">
          <option value="int">int</option>
          <option value="double">double</option>
          <option value="string">string</option>
          <option value="uint8">uint8 (Bit)</option>
        </select>
      </div>
    </div>
    <button onclick="createSeq()">Создать</button>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label>Value</label>
        <input type="text" id="inputVal" placeholder="value">
      </div>
      <div>
        <label>Index (for Insert/Get)</label>
        <input type="text" id="inputIdx" placeholder="0">
      </div>
      <div>
        <label>Predicate</label>
        <select id="predicate">
          <option value="none">None</option>
          <option value="IsEven">IsEven</option>
          <option value="IsPositive">IsPositive</option>
          <option value="IsDivBy3">IsDivBy3</option>
          <option value="Square">Map: Square</option>
          <option value="SumFunc">Reduce: Sum</option>
        </select>
      </div>
    </div>
    <div>
      <button onclick="exec('append')">Append</button>
      <button onclick="exec('prepend')">Prepend</button>
      <button onclick="exec('insertat')">InsertAt</button>
      <button onclick="exec('get')">GetAt</button>
      <button class="secondary" onclick="exec('length')">Size</button>
      <button class="secondary" onclick="exec('first')">First</button>
      <button class="secondary" onclick="exec('last')">Last</button>
      <button class="secondary" onclick="exec('where')">Where</button>
      <button class="secondary" onclick="exec('getfirstpred')">GetFirst Pred</button>
      <button class="secondary" onclick="exec('getlastpred')">GetLast Pred</button>
      <button class="secondary" onclick="exec('map')">Map</button>
      <button class="secondary" onclick="exec('reduce')">Reduce</button>
      <button class="secondary" onclick="printAll()">Print All</button>
    </div>
  </div>

  <div class="panel">
    <label>Output</label>
    <div id="output">Ready.</div>
  </div>
</div>

<script>
async function api(action, value = '', index = '', pred = 'none') {
  const body = JSON.stringify({
    action, value, index, pred,
    seqType: document.getElementById('seqType').value,
    dataType: document.getElementById('dataType').value
  });
  try {
    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    const data = await res.json();
    document.getElementById('output').textContent = data.status === 'ok' ? data.data : data.data;
  } catch (e) {
    document.getElementById('output').textContent = 'Error: ' + e.message;
  }
}

function createSeq() { api('create'); }
function printAll() { api('printall'); }
function exec(action) {
  const val = document.getElementById('inputVal').value;
  const idx = document.getElementById('inputIdx').value;
  const pred = document.getElementById('predicate').value;
  api(action, val, idx, pred);
}
</script>
</body>
</html>
